{% extends "base.html" %}
{% block title %}Edit Account - SmartBank{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>Edit Account</h1>
    </div>
    <form method="POST" class="form-card">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Account Name</label>
                <input type="text" id="name" name="name" value="{{ account.name }}" required>
            </div>
            <div class="form-group">
                <label for="account_type">Account Type</label>
                <select id="account_type" name="account_type" required>
                    <option value="">Select type</option>
                    <option value="checking" {% if account.account_type == 'checking' %}selected{% endif %}>Checking</option>
                    <option value="savings" {% if account.account_type == 'savings' %}selected{% endif %}>Savings</option>
                    <option value="credit" {% if account.account_type == 'credit' %}selected{% endif %}>Credit Card</option>
                    <option value="investment" {% if account.account_type == 'investment' %}selected{% endif %}>Investment</option>
                </select>
            </div>
            <div class="form-group">
                <label for="balance">Balance</label>
                <input type="number" id="balance" name="balance" value="{{ account.balance }}" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="account_number">Account Number</label>
                <input type="text" id="account_number" name="account_number" value="{{ account.account_number }}" required>
            </div>
            <div class="form-group">
                <label for="rib">RIB</label>
                <input type="text" id="rib" name="rib" value="{{ account.rib }}" required>
            </div>
        </div>
        <div style="display: flex; gap: 16px;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('accounts') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
