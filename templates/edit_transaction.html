{% extends "base.html" %}
{% block title %}Edit Transaction{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>Edit Transaction</h1>
    </div>
    <form method="POST" class="form-card">
        <div class="form-row">
            <div class="form-group">
                <label for="account_id">Account</label>
                <select id="account_id" name="account_id" required>
                    {% for account in accounts %}
                        <option value="{{ account.id }}" {% if account.id == transaction.account_id %}selected{% endif %}>{{ account.name }} ({{ account.account_type|title }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount" step="0.01" value="{{ transaction.amount }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" value="{{ transaction.description }}" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if cat == transaction.category %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="transaction_type">Type</label>
                <select id="transaction_type" name="transaction_type" required>
                    <option value="income" {% if transaction.transaction_type == 'income' %}selected{% endif %}>Income</option>
                    <option value="expense" {% if transaction.transaction_type == 'expense' %}selected{% endif %}>Expense</option>
                </select>
            </div>
        </div>
        <div style="display: flex; gap: 16px;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('transactions', account_id=transaction.account_id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
